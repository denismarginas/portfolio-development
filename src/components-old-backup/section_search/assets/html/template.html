<script src="{{ index_data_url }}"></script>
<script src="{{ search_js_url }}"></script>
<section class="dm-search-section grid-background-animation">
    <container>
        <div class="dm-search-header" data-motion="transition-fade-0">
            <h2>{{ search_title }}</h2>
            <form id="search" class="dm-search-bar">
                <div class="search-input">
                    <input id="search-keywords" class="input-search" placeholder="{{ search_placeholder }}">
                    <button id="search-content" type="submit" class="search-submit">{{ search_button_text }}</button>
                </div>
                <div id="searched-string-section" class="searched-string-section">
                    <span class="searched-string"></span>
                    <span class="searched-delete" style="display: none;">{{ close_svg }}</span>
                </div>
            </form>
        </div>
        <ul id="search-list" class="dm-search-list">
            {{ search_items }}
        </ul>
    </container>
</section>
