<div class="page-not-found{{ extra_class }}"{{ id_attr }}>
  <div class="page-not-found-card bg-radial-primary">
    {{ overlays }}
    <p class="page-not-found-code" aria-hidden="true">{{ code }}</p>
    <div class="page-not-found-heading">
      {{ icon }}
      <h1 class="page-not-found-title">{{ title }}</h1>
    </div>
    {{ text }}
    {{ path }}
    {{ note }}
    {{ buttons }}
  </div>
</div>
