<div class="block-social-profile{{ extra_class }}"{{ id_attr }}>
  <div class="block-social-profile-wallpaper">{{ wallpaper }}</div>
  <div class="block-social-profile-user">
    <div class="block-social-profile-avatar">{{ avatar }}</div>
    <div class="block-social-profile-details">
      <{{ tag }} class="block-social-profile-title title-tertiary">{{ title }}</{{ tag }}>
      {{ description }}
    </div>
  </div>
</div>
