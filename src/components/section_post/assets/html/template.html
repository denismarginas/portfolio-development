{{ inline_styles }}
<section class="dm-post grid-background-animation">
    <container>
        <div class="post-content">
            {{ post_content }}
        </div>
        <aside class="post-data">
            {{ post_image }}
            <div class="post-text" data-motion="transition-fade-0 transition-slideInLeft-0" data-duration="0.6s">
                {{ sidebar_content }}
            </div>
        </aside>
    </container>
</section>
