<li{{ id_attr }} class="resume-card bg-radial-primary" data-item-id="{{ item_id }}" data-model="{{ model }}" data-lang="{{ lang }}">
  {{ preview }}
  <div class="resume-card-content">
    {{ title_html }}
    {{ description_html }}
    <div class="resume-card-meta">
      {{ lang_html }}
      {{ date_html }}
    </div>
    {{ actions_html }}
  </div>
</li>
