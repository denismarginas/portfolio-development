<div class="form-box{{ extra_class }}"{{ id_attr }}>
  {{ title }}
  <form class="form-item" id="{{ form_id }}" data-form-type="{{ form_type }}" data-external-type="{{ external_type }}" data-external-url="{{ external_url }}" autocomplete="on" novalidate>
    {{ final_fields }}
    {{ steps }}
    <div class="form-status" role="status" aria-live="polite" hidden>
      <p class="form-status-text">{{ submit_note }}</p>
      <a class="btn btn-primary form-status-link" href="{{ external_url }}" target="_blank" rel="noopener">{{ link_text }}</a>
    </div>
  </form>
</div>
