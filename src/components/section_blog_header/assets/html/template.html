<section class="blurred-lines-animation dm-blog-header"{{ style }}>
    <container>
        <div class="dm-blog-user">
            <div class="dm-blog-user-wallpaper">
                {{ wallpaper_html }}
            </div>
            <div class="dm-blog-user-data">
                <div class="dm-blog-user-logo">
                    {{ logo_html }}
                </div>
                <div class="dm-blog-user-details">
                    <h2 class="dm-blog-user-name">{{ username }}</h2>
                    <p class="dm-blog-user-description">{{ description }}</p>
                </div>
            </div>
        </div>
    </container>
    {{ lights_html }}
</section>
