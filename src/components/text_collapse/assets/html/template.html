<div class="text-collapse{{ extra_class }}" data-text-collapse>
  <div class="text-collapse-short">{{ short }}</div>
  <div class="text-collapse-full" hidden>{{ full }}</div>
  <button type="button" class="text-collapse-toggle" aria-expanded="false" data-text-collapse-toggle data-label-more="{{ more }}" data-label-less="{{ less }}">{{ icon }}<span class="text-collapse-label">{{ more }}</span></button>
</div>
