<label class="header-theme-mode-toggle" data-mode="{{ toggle_mode }}" aria-label="Toggle color theme">
  <input type="checkbox" class="header-theme-mode-toggle-input">
  <span class="header-theme-mode-toggle-track" aria-hidden="true">
    <span class="header-theme-mode-toggle-icon" theme-style="light" {{ sun_active_attr }}>{{ sun_icon_html }}</span>
    <span class="header-theme-mode-toggle-icon" theme-style="dark" {{ moon_active_attr }}>{{ moon_icon_html }}</span>
    <span class="header-theme-mode-toggle-thumb" aria-hidden="true"></span>
  </span>
</label>
