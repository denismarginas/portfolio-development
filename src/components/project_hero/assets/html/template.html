<section class="project-hero project-hero-{{ variant }}"{{ id_attr }}>
  <div class="project-hero-bg" aria-hidden="true"></div>
  <container class="project-hero-inner">
    <div class="project-hero-copy">
      {{ brand }}
      <div class="project-hero-eyebrow">{{ eyebrow }}</div>
      <h1 class="project-hero-title">{{ title }}</h1>
      {{ lead }}
      {{ actions }}
      {{ meta }}
    </div>
    {{ stage }}
  </container>
</section>
