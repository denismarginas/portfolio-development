<li class="hobby-pc-video-game" data-item-id="{{ item_id }}" data-name="{{ name }}" data-rank="{{ rank }}" data-playtime="{{ playtime }}" data-display="{{ display }}"{{ hidden_attr }}>
  <div class="hobby-pc-video-game-box">
    {{ banner }}
    <div class="hobby-pc-video-game-details">
      {{ rank_html }}
      {{ playtime_html }}
      {{ tags_html }}
    </div>
    <p class="hobby-pc-video-game-name">{{ name }}</p>
  </div>
</li>
